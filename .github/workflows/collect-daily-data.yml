name: collect-daily-data

on:
  schedule:
    # 22:00 UTC, Mon-Fri (approx. after US market close incl. DST slack).
    # Cron is UTC-only; this is a first pass and can be retimed later.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect M7 data (OHLCV + indicators + quant score)
        run: python scripts/collect_daily_data.py
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: daily M7 data collection $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push


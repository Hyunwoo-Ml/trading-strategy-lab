name: collect-daily-data

on:
  schedule:
    # 22:00 UTC, Mon-Fri (approx. after US market close incl. DST slack).
    # Cron is UTC-only; this is a first pass and can be retimed later.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # sw1/news/scorer.py -- only used when a ticker has a weekly
      # commentary file under sw1/news/input/{TICKER}.txt; missing input
      # (or a missing secret, for a fork/PR run) just skips that ticker's
      # news score rather than failing the job.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect M7 data (OHLCV + indicators + quant + news score)
        run: python scripts/collect_daily_data.py
      - name: Generate user-defined price-criteria models (buy1/buy2/target)
        run: python scripts/generate_price_criteria.py
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: daily M7 data collection $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

name: network-check

on:
  workflow_dispatch:

jobs:
  yfinance-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run yfinance PoC (validates GitHub Actions can reach Yahoo Finance)
        run: python scripts/yfinance_poc.py


name: market-dashboard

on:
  schedule:
    # 22:20 UTC, Mon-Fri -- after the US close. Kept separate from
    # collect-daily-data.yml so a Yahoo hiccup here can't block SW1/SW2.
    - cron: "20 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build market dashboard data (Yahoo + FRED)
        run: python scripts/build_market_dashboard.py
      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market/
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: market dashboard data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Other workflows push to main around the same time; rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase
          done
          exit 1

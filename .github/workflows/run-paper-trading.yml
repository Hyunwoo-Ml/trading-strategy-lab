name: run-paper-trading

on:
  schedule:
    # 22:30 UTC, Mon-Fri -- 30 minutes after collect-daily-data.yml (22:00 UTC)
    # so today's signals are already committed before this reads them.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run paper trading for all registered models
        run: python scripts/run_daily_paper_trading.py
      - name: Commit paper trading state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sw2/
          git diff --staged --quiet || git commit -m "chore: daily paper trading run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

